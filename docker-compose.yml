version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nids-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=sqlite:///./data/nids_platform.db
      - SECRET_KEY=dev-secret-key-change-in-production-cyber-sentinel-2026
    volumes:
      - ./data:/app/data
      - ./backend/artifacts/models:/app/backend/artifacts/models
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nids-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
